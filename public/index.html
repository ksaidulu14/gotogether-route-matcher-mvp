<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GoTogetherRides</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f8fc;
      color: #172033;
    }

    .container {
      width: min(1050px, 94%);
      margin: 38px auto 60px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 30px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 17px;
      color: #68758a;
    }

    .journeys {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .journey-card {
      background: white;
      border: 1px solid #e2e7ef;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(20, 30, 50, 0.03);
    }

    .journey-title {
      font-size: 19px;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 16px;
      position: relative;
    }

    label {
      display: block;
      font-size: 14px;
      color: #68758a;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 15px;
      border: 1px solid #d9e0ea;
      border-radius: 11px;
      font-size: 16px;
      outline: none;
      color: #172033;
      background: white;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
    }

    .suggestions {
      position: absolute;
      top: 78px;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #dce2eb;
      border-radius: 11px;
      box-shadow: 0 10px 25px rgba(20, 30, 50, 0.12);
      z-index: 1000;
      overflow: hidden;
      display: none;
    }

    .suggestion {
      padding: 12px 14px;
      cursor: pointer;
      border-bottom: 1px solid #edf0f4;
      font-size: 14px;
      line-height: 1.35;
    }

    .suggestion:last-child {
      border-bottom: none;
    }

    .suggestion:hover {
      background: #f4f7fb;
    }

    .suggestion-main {
      font-size: 15px;
      color: #172033;
    }

    .suggestion-sub {
      font-size: 12px;
      color: #7b8798;
      margin-top: 3px;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      height: 56px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 400;
    }

    #go,
    #retry {
      flex: 1;
      border: none;
      background: #2563eb;
      color: white;
    }

    #go:hover,
    #retry:hover {
      background: #1d4ed8;
    }

    #retry {
      display: none;
    }

    #clear {
      flex: 1;
      background: white;
      border: 1px solid #d9e0ea;
      color: #4b5563;
    }

    #status {
      min-height: 24px;
      text-align: center;
      margin: 18px 0 4px;
      color: #68758a;
      font-size: 15px;
    }

    #result {
      display: none;
      margin-top: 22px;
    }

    .result-box {
      background: white;
      border: 1px solid #e2e7ef;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 5px 22px rgba(20, 30, 50, 0.04);
      animation: appear 0.35s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 23px;
      font-weight: 500;
      margin-bottom: 25px;
    }

    .green-dot {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #35c978;
      box-shadow: 0 0 0 6px rgba(53, 201, 120, 0.12);
    }

    .red-dot {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 0 6px rgba(239, 68, 68, 0.10);
    }

    .match-title {
      color: #15803d;
    }

    .no-match-title {
      color: #b91c1c;
    }

    .people {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    .person-box {
      background: #f8fafc;
      border-radius: 13px;
      padding: 17px;
    }

    .person-name {
      font-size: 17px;
      margin-bottom: 7px;
    }

    .person-route {
      color: #536176;
      font-size: 14px;
      line-height: 1.5;
    }

    .message {
      background: #f8fafc;
      border-radius: 13px;
      padding: 18px;
      font-size: 16px;
      line-height: 1.55;
    }

    .message strong {
      font-weight: 500;
    }

    .simple-points {
      margin-top: 18px;
      display: grid;
      gap: 10px;
    }

    .simple-point {
      font-size: 15px;
      color: #334155;
      padding: 12px 14px;
      border-radius: 10px;
      background: #fafbfd;
    }

    .no-match-message {
      background: #fafafa;
      border-radius: 13px;
      padding: 18px;
      color: #596579;
      font-size: 15px;
      line-height: 1.55;
    }

    #map {
      height: 500px;
      margin-top: 22px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #e2e7ef;
    }

    @media (max-width: 720px) {

      .journeys {
        grid-template-columns: 1fr;
      }

      .people {
        grid-template-columns: 1fr;
      }

      .actions {
        flex-direction: column;
      }

      #map {
        height: 420px;
      }

    }

  </style>
</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo">
      GoTogetherRides
    </div>

    <div class="subtitle">
      Find someone heading your way.
    </div>

  </div>


  <div class="journeys">

    <!-- YOUR JOURNEY -->

    <div class="journey-card">

      <div class="journey-title">
        👋 Your journey
      </div>

      <div class="field">

        <label>
          Your name
        </label>

        <input
          id="aName"
          type="text"
          placeholder="What should we call you?"
        >

      </div>


      <div class="field">

        <label>
          Where are you starting?
        </label>

        <input
          id="aPickup"
          type="text"
          placeholder="Start typing a place..."
          autocomplete="off"
        >

        <div
          id="aPickupSuggestions"
          class="suggestions"
        ></div>

      </div>


      <div class="field">

        <label>
          Where are you going?
        </label>

        <input
          id="aDrop"
          type="text"
          placeholder="Start typing a place..."
          autocomplete="off"
        >

        <div
          id="aDropSuggestions"
          class="suggestions"
        ></div>

      </div>

    </div>


    <!-- OTHER JOURNEY -->

    <div class="journey-card">

      <div class="journey-title">
        👋 Their journey
      </div>

      <div class="field">

        <label>
          Their name
        </label>

        <input
          id="bName"
          type="text"
          placeholder="What should we call them?"
        >

      </div>


      <div class="field">

        <label>
          Where are they starting?
        </label>

        <input
          id="bPickup"
          type="text"
          placeholder="Start typing a place..."
          autocomplete="off"
        >

        <div
          id="bPickupSuggestions"
          class="suggestions"
        ></div>

      </div>


      <div class="field">

        <label>
          Where are they going?
        </label>

        <input
          id="bDrop"
          type="text"
          placeholder="Start typing a place..."
          autocomplete="off"
        >

        <div
          id="bDropSuggestions"
          class="suggestions"
        ></div>

      </div>

    </div>

  </div>


  <div class="actions">

    <button id="go">
      FIND MY MATCH
    </button>

    <button id="retry">
      TRY ANOTHER JOURNEY
    </button>

    <button id="clear">
      CLEAR
    </button>

  </div>


  <div id="status"></div>


  <div id="result"></div>


  <div id="map"></div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

const map = L.map("map").setView(
  [17.385, 78.4867],
  11
);


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution:
      "&copy; OpenStreetMap contributors"
  }
).addTo(map);


let routeLayers = [];


function value(id) {

  return String(
    document.getElementById(id).value || ""
  ).trim();

}


function clearMap() {

  routeLayers.forEach(layer => {

    map.removeLayer(layer);

  });

  routeLayers = [];

}


function setupSuggestions(inputId, boxId) {

  const input =
    document.getElementById(inputId);

  const box =
    document.getElementById(boxId);

  let timer = null;


  input.addEventListener(
    "input",
    function() {

      clearTimeout(timer);

      const text =
        input.value.trim();


      if (text.length < 2) {

        box.style.display = "none";
        box.innerHTML = "";

        return;
      }


      timer = setTimeout(
        async function() {

          try {

            const url =
              "https://nominatim.openstreetmap.org/search" +
              "?format=jsonv2" +
              "&limit=5" +
              "&countrycodes=in" +
              "&q=" +
              encodeURIComponent(text);


            const response =
              await fetch(url, {
                headers: {
                  "Accept":
                    "application/json"
                }
              });


            const places =
              await response.json();


            box.innerHTML = "";


            if (!places.length) {

              box.style.display = "none";

              return;
            }


            places.forEach(
              function(place) {

                const item =
                  document.createElement("div");

                item.className =
                  "suggestion";


                const parts =
                  place.display_name
                    .split(",");


                const main =
                  parts
                    .slice(0, 2)
                    .join(",")
                    .trim();


                const sub =
                  parts
                    .slice(2)
                    .join(",")
                    .trim();


                item.innerHTML = `

                  <div class="suggestion-main">
                    📍 ${main}
                  </div>

                  ${
                    sub
                      ? `<div class="suggestion-sub">${sub}</div>`
                      : ""
                  }

                `;


                item.addEventListener(
                  "click",
                  function() {

                    input.value =
                      place.display_name;

                    box.style.display =
                      "none";

                    box.innerHTML = "";

                  }
                );


                box.appendChild(item);

              }
            );


            box.style.display = "block";


          } catch (error) {

            console.error(
              "Suggestion error:",
              error
            );

          }

        },
        450
      );

    }
  );


  document.addEventListener(
    "click",
    function(event) {

      if (
        !input.contains(event.target) &&
        !box.contains(event.target)
      ) {

        box.style.display =
          "none";

      }

    }
  );

}


setupSuggestions(
  "aPickup",
  "aPickupSuggestions"
);

setupSuggestions(
  "aDrop",
  "aDropSuggestions"
);

setupSuggestions(
  "bPickup",
  "bPickupSuggestions"
);

setupSuggestions(
  "bDrop",
  "bDropSuggestions"
);


function showResult(data, names) {

  const result =
    document.getElementById("result");


  result.style.display =
    "block";


  const yourName =
    names.a ||
    "You";


  const theirName =
    names.b ||
    "The other person";


  if (data.matched) {

    result.innerHTML = `

      <div class="result-box">

        <div class="result-heading match-title">

          <span class="green-dot"></span>

          ${yourName} & ${theirName}
          could travel together

        </div>


        <div class="people">

          <div class="person-box">

            <div class="person-name">
              👤 ${yourName}
            </div>

            <div class="person-route">
              ${data.a.pickup.name}
              →
              ${data.a.drop.name}
            </div>

          </div>


          <div class="person-box">

            <div class="person-name">
              👤 ${theirName}
            </div>

            <div class="person-route">
              ${data.b.pickup.name}
              →
              ${data.b.drop.name}
            </div>

          </div>

        </div>


        <div class="message">

          🛣️ <strong>
            You're both heading in a similar direction.
          </strong>

          <br>

          A good part of your journeys follows
          the same way.

        </div>


        <div class="simple-points">

          <div class="simple-point">
            🚗 Your journeys look compatible.
          </div>

          <div class="simple-point">
            📍 Your starting areas are reasonably close.
          </div>

          <div class="simple-point">
            🛣️ Your routes share part of the same road network.
          </div>

        </div>

      </div>

    `;

  } else {

    result.innerHTML = `

      <div class="result-box">

        <div class="result-heading no-match-title">

          <span class="red-dot"></span>

          These two journeys don't line up

        </div>


        <div class="people">

          <div class="person-box">

            <div class="person-name">
              👤 ${yourName}
            </div>

            <div class="person-route">
              ${data.a.pickup.name}
              →
              ${data.a.drop.name}
            </div>

          </div>


          <div class="person-box">

            <div class="person-name">
              👤 ${theirName}
            </div>

            <div class="person-route">
              ${data.b.pickup.name}
              →
              ${data.b.drop.name}
            </div>

          </div>

        </div>


        <div class="no-match-message">

          🛣️ These journeys don't appear to follow
          the same route, so sharing this trip may
          not be practical.

        </div>

      </div>

    `;

  }

}


function drawRoutes(data) {

  clearMap();


  const routeA =
    L.geoJSON(
      data.routeA,
      {
        style: {
          weight: 5
        }
      }
    ).addTo(map);


  const routeB =
    L.geoJSON(
      data.routeB,
      {
        style: {
          weight: 5,
          dashArray: "8 8"
        }
      }
    ).addTo(map);


  routeLayers.push(
    routeA,
    routeB
  );


  const bounds =
    L.featureGroup([
      routeA,
      routeB
    ]).getBounds();


  map.fitBounds(
    bounds,
    {
      padding: [30, 30]
    }
  );

}


async function findMatch() {

  const aName =
    value("aName");

  const bName =
    value("bName");

  const aPickup =
    value("aPickup");

  const aDrop =
    value("aDrop");

  const bPickup =
    value("bPickup");

  const bDrop =
    value("bDrop");


  if (
    !aName ||
    !bName ||
    !aPickup ||
    !aDrop ||
    !bPickup ||
    !bDrop
  ) {

    document.getElementById("status")
      .textContent =
      "Please enter both names and all four locations.";

    return;
  }


  document.getElementById("status")
    .textContent =
    "Finding a possible match...";


  document.getElementById("result")
    .style.display =
    "none";


  document.getElementById("go")
    .style.display =
    "none";


  document.getElementById("clear")
    .style.display =
    "none";


  document.getElementById("retry")
    .style.display =
    "none";


  try {

    const response =
      await fetch(
        "/api/match",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            aPickup,
            aDrop,
            bPickup,
            bDrop

          })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Something went wrong."
      );

    }


    document.getElementById("status")
      .textContent = "";


    showResult(
      data,
      {
        a: aName,
        b: bName
      }
    );


    drawRoutes(data);


    document.getElementById("retry")
      .style.display =
      "block";


  } catch (error) {

    console.error(error);


    document.getElementById("status")
      .textContent =
      error.message;


    document.getElementById("go")
      .style.display =
      "block";


    document.getElementById("clear")
      .style.display =
      "block";

  }

}


function resetJourney() {

  [
    "aName",
    "bName",
    "aPickup",
    "aDrop",
    "bPickup",
    "bDrop"
  ].forEach(
    function(id) {

      document.getElementById(id)
        .value = "";

    }
  );


  document.getElementById("result")
    .style.display =
    "none";


  document.getElementById("status")
    .textContent =
    "";


  document.getElementById("go")
    .style.display =
    "block";


  document.getElementById("clear")
    .style.display =
    "block";


  document.getElementById("retry")
    .style.display =
    "none";


  clearMap();


  map.setView(
    [17.385, 78.4867],
    11
  );

}


document.getElementById("go")
  .addEventListener(
    "click",
    findMatch
  );


document.getElementById("retry")
  .addEventListener(
    "click",
    resetJourney
  );


document.getElementById("clear")
  .addEventListener(
    "click",
    resetJourney
  );

</script>

</body>
</html>
